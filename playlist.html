<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Playlist for Anton</title>
  <style>
    /* DESIGN DARI KODE ASLI ANDA (DARK THEME) */
    body {
      background-color: #0E162B;
      color: #E0E7FF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #1A2E4E;
      padding: 40px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 700px;
      margin-bottom: 30px;
      box-sizing: border-box;
      text-align: center;
      position: relative;
      height: 400px; 
      border-top: 2px solid rgba(255, 255, 255, 0.1);
    }

    .image-background-wrapper {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 20px;
      overflow: hidden;
    }

    .image-background-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    .image-background-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .content-overlay {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    h1 {
      color: #fff;
      font-size: 2.8em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 7px rgba(0, 0, 0, 0.7);
    }

    .add-track-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      padding: 0 20px;
    }

    .add-track-form input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #446688;
      background-color: rgba(255, 255, 255, 0.08);
      color: #E0E7FF;
      font-size: 1em;
      background-image: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.05));
    }

    .add-track-form input::placeholder {
      color: #A0B0CC;
    }

    .add-track-form button {
      background-color: #3C638E;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      background-image: linear-gradient(to top, rgba(255,255,255,0.15), rgba(0,0,0,0.15));
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
    }

    .playlist-section {
      background-color: #1A2E4E;
      border-radius: 16px;
      padding: 20px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .playlist-section h2 {
      font-size: 2.2em;
      margin-bottom: 20px;
      color: white;
    }

    .playlist {
      list-style: none;
      padding: 0;
      width: 100%;
    }

    /* Dark-version Playlist Item Styling */
    .song-block {
      background-color: #25426B;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px 20px;
      margin: 15px auto;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      background-image: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.1));
      position: relative;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }
    
    .spotify-embed-container {
      width: 100%;
    }

    iframe {
        border-radius: 12px;
        width: 100%;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        display: block;
    }


    .remove-btn {
      background-color: #E63946;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.9em;
      align-self: flex-end;
      margin-top: 10px;
    }
    
    .back-button-container {
      margin-top: 30px;
      text-align: center;
    }

    .back-button-container a {
      background-color: #3C638E;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      min-width: 200px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-background-wrapper">
      <img src="kiyowo.jpg" alt="Background Image">
    </div>
    <div class="content-overlay">
      <h1>Playlist for Anton</h1>
      <div class="add-track-form">
        <input type="text" id="spotifyUrl" placeholder="paste spotify url here" required>
        <button onclick="addSong()">Add to Playlist</button>
      </div>
    </div>
  </div>

  <div class="playlist-section">
    <h2>Added Tracks</h2>
    <div class="playlist" id="playlist">
      <p style="text-align: center; color: #ccc;">Loading songs...</p>
    </div>
  </div>

  <div class="back-button-container">
    <a href="index.html">Back</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCfaxJylSTSs2pptVxw-ebnkOEZsLEmtV8",
      authDomain: "ana-cantiii.firebaseapp.com",
      projectId: "ana-cantiii",
      storageBucket: "ana-cantiii.firebasestorage.app",
      messagingSenderId: "997694908881",
      appId: "1:997694908881:web:b8ab2a0cb88f31d8cb18f0",
      measurementId: "G-94HP5DJ4MF"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Regex untuk validasi URL Spotify
    const spotifyUrlRegex = /^(?:https?:\/\/(?:open\.spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)(?:\?.*)?|spotify:((track|album|playlist|artist):)?([a-zA-Z0-9]+)))$/;

    async function addSong() {
      const spotifyUrlInput = document.getElementById('spotifyUrl');
      const url = spotifyUrlInput.value.trim();
      
      if (url === '') {
        alert('Spotify link cannot be empty!');
        return;
      }

      let type = '';
      let id = '';

      const match = url.match(spotifyUrlRegex);
      if (!match) {
        alert('Please enter a valid Spotify URL.'); 
        return;
      }
      // Dapatkan tipe dan ID yang benar dari hasil regex
      type = match[1] || match[4];
      id = match[2] || match[5];

      try {
        await db.collection('ana_playlist_items').add({
          spotifyType: type,
          spotifyId: id,
          message: "", 
          addedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        spotifyUrlInput.value = '';
        alert('Song successfully added to Firestore and will appear shortly!'); 
      } catch (error) {
        console.error("Error adding data:", error);
        alert(`Failed to add song: ${error.message}`);
      }
    }

    function displaySong(doc) {
      const data = doc.data();
      const playlistElement = document.getElementById('playlist');
      
      const existingItem = document.querySelector(`.song-block[data-id="${doc.id}"]`);
      if (existingItem) {
          existingItem.remove();
      }

      const songBlock = document.createElement('div');
      songBlock.className = 'song-block';
      songBlock.setAttribute('data-id', doc.id);
      
      // Menggunakan tipe "track", "album", atau "playlist"
      if (data.spotifyId && (data.spotifyType === 'track' || data.spotifyType === 'album' || data.spotifyType === 'playlist')) {
        
        // **KODE YANG DIPERBAIKI (URL EMBED KRITIS):** Menggunakan format URL embed resmi yang benar
        const embedUrl = `https://embed.spotify.com/?uri=spotify:${data.spotifyType}:${data.spotifyId}&theme=0`;
        
        // Tinggi iframe disesuaikan
        const iframeHeight = (data.spotifyType === 'track') ? 152 : 352;
        
        const iframe = document.createElement('iframe');
        iframe.style.borderRadius = '12px';
        iframe.src = embedUrl; // Menggunakan URL yang sudah dikoreksi
        iframe.width = '100%';
        iframe.height = iframeHeight;
        iframe.frameBorder = '0';
        iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
        iframe.loading = 'lazy';
        
        const embedContainer = document.createElement('div');
        embedContainer.className = 'spotify-embed-container';
        embedContainer.appendChild(iframe);
        songBlock.appendChild(embedContainer);
      } else {
        // Tampilkan pesan jika ID atau Tipe tidak valid (misalnya, "artist")
        const errorText = document.createElement('p');
        errorText.textContent = `Cannot load item of type: ${data.spotifyType || 'unknown'}`;
        errorText.style.color = '#ff9999';
        songBlock.appendChild(errorText);
      }

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = 'Remove'; 
      removeBtn.onclick = () => removeSong(doc.id);
      songBlock.appendChild(removeBtn);

      // Tambahkan item baru di bagian atas
      playlistElement.prepend(songBlock);
    }

    async function fetchPlaylist() {
        const playlistElement = document.getElementById('playlist');
        playlistElement.innerHTML = '<p style="text-align: center; color: #ccc;">Loading songs...</p>'; 

        // Gunakan onSnapshot untuk pembaruan real-time
        db.collection('ana_playlist_items').orderBy('addedAt', 'desc').onSnapshot((snapshot) => {
            
            // Hapus pesan loading awal
            if (playlistElement.querySelector('p') && playlistElement.querySelector('p').textContent === 'Loading songs...') {
                playlistElement.innerHTML = '';
            }

            if (snapshot.empty) {
                playlistElement.innerHTML = '<p style="text-align: center; color: #ccc;">No songs in the playlist yet. Add one!</p>'; 
                return;
            }

            // Proses hanya perubahan
            snapshot.docChanges().forEach(change => {
                if (change.type === "added") {
                    displaySong(change.doc);
                }
                if (change.type === "modified") {
                    displaySong(change.doc); 
                }
                if (change.type === "removed") {
                    // Hapus elemen jika data dihapus dari Firestore
                    const removedItem = document.querySelector(`.song-block[data-id="${change.doc.id}"]`);
                    if (removedItem) {
                        removedItem.remove();
                    }
                }
            });

        }, (error) => {
            console.error("Error fetching playlist:", error);
            playlistElement.innerHTML = '<p style="text-align: center; color: #ff6666;">Failed to load playlist. Check your connection or Firebase rules.</p>'; 
        });
    }

    async function removeSong(id) {
      if (!confirm('Are you sure you want to delete this song?')) return; 
      try {
        await db.collection('ana_playlist_items').doc(id).delete();
        alert('Song successfully deleted!'); 
      } catch (error) {
        console.error("Error removing song:", error);
        alert(`Failed to delete song: ${error.message}`); 
      }
    }

    document.addEventListener("DOMContentLoaded", fetchPlaylist);
  </script>

</body>
</html>
